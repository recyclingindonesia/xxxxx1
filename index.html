<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPost Pro - Blogger Hybrid SEO Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> .hidden { display: none; } </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-600 mb-2">OmniPost Pro</h1>
            <p class="text-gray-600">Blogger Hybrid SEO Generator & Sales Manager</p>
        </header>

        <!-- Login View -->
        <section id="view-login" class="bg-white p-8 rounded-lg shadow-md max-w-md mx-auto">
            <h2 class="text-2xl font-semibold mb-6 text-center">Masuk ke Sistem</h2>
            <div class="space-y-4">
                <input type="password" id="login-password" class="w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Password Akses">
                <button onclick="handleLogin()" id="btn-login" class="w-full bg-blue-600 text-white font-bold py-2 rounded">Masuk</button>
                <p class="text-center text-sm">Belum punya akses? <a href="#" onclick="showView('view-register')" class="text-blue-600">Daftar</a></p>
            </div>
        </section>

        <!-- Register View -->
        <section id="view-register" class="bg-white p-8 rounded-lg shadow-md max-w-md mx-auto hidden">
            <h2 class="text-2xl font-semibold mb-6 text-center">Pendaftaran Legalitas</h2>
            <form class="space-y-4" onsubmit="handleRegister(event)">
                <input type="text" name="name" placeholder="Nama Lengkap" required class="w-full border p-2 rounded">
                <textarea name="address" placeholder="Alamat" required class="w-full border p-2 rounded"></textarea>
                <input type="tel" name="whatsapp" placeholder="WhatsApp" required class="w-full border p-2 rounded">
                <input type="password" name="password" placeholder="Password Baru" required class="w-full border p-2 rounded">
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded">Daftar</button>
                <p class="text-center text-sm"><a href="#" onclick="showView('view-login')" class="text-blue-600">Kembali ke Login</a></p>
            </form>
        </section>

        <!-- Dashboard View -->
        <section id="view-dashboard" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded shadow">
                <h2 class="text-xl font-bold">Dashboard Postingan</h2>
                <div>
                    <button onclick="openPostForm()" class="bg-blue-600 text-white px-4 py-2 rounded mr-2">+ Post Baru</button>
                    <button onclick="handleLogout()" class="text-red-500">Logout</button>
                </div>
            </div>
            <div id="posts-list" class="grid gap-4 md:grid-cols-2"></div>
        </section>

        <!-- Post Form View -->
        <section id="view-post" class="bg-white p-8 rounded-lg shadow-md hidden max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="post-form-title" class="text-2xl font-semibold">Buat Postingan Baru</h2>
                <button onclick="showView('view-dashboard')" class="text-gray-500">Batal</button>
            </div>
            <form id="form-post" class="space-y-4" onsubmit="handlePost(event)">
                <input type="hidden" name="jsonId" id="field-jsonId">
                <input type="text" name="title" id="field-title" placeholder="Judul (Max 150)" maxlength="150" required class="w-full border p-2 rounded">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" name="price" id="field-price" placeholder="Harga" required class="w-full border p-2 rounded">
                    <input type="text" name="location" id="field-location" placeholder="Lokasi" required class="w-full border p-2 rounded">
                </div>
                <textarea name="description" id="field-description" placeholder="Deskripsi Dasar" required class="w-full border p-2 rounded" rows="3"></textarea>
                <div id="photo-upload-area">
                    <label class="block text-sm">Foto Barang</label>
                    <input type="file" id="post-photo" accept="image/*" class="w-full text-sm mt-1">
                </div>
                <input type="text" name="alt_text" id="field-alt_text" placeholder="Alt Text SEO" required class="w-full border p-2 rounded">
                <button type="submit" id="btn-submit-post" class="w-full bg-blue-600 text-white font-bold py-3 rounded">Simpan & Posting</button>
            </form>
        </section>

        <div id="status-msg" class="mt-6 p-4 rounded hidden text-center"></div>
    </div>

    <script>
        const GAS_URL = "YOUR_APPS_SCRIPT_URL";
        let isEditMode = false;

        function showView(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'view-dashboard') loadPosts();
        }

        function showStatus(msg, err = false) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.className = `mt-6 p-4 rounded text-center ${err ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        async function handleLogin() {
            const password = document.getElementById('login-password').value;
            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'login', password }) });
            const result = await res.json();
            if (result.success) {
                localStorage.setItem('omnipost_pass', password);
                showView('view-dashboard');
            } else showStatus(result.message, true);
        }

        function handleLogout() { localStorage.removeItem('omnipost_pass'); showView('view-login'); }

        async function handleRegister(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.action = 'register';
            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
            const result = await res.json();
            if (result.success) { showStatus('Sukses! Silakan login.'); showView('view-login'); }
        }

        async function loadPosts() {
            const password = localStorage.getItem('omnipost_pass');
            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getPosts', password }) });
            const result = await res.json();
            const list = document.getElementById('posts-list');
            list.innerHTML = result.posts.map(p => `
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-600">
                    <h3 class="font-bold">${p.title}</h3>
                    <p class="text-sm text-gray-500">${p.price} - ${p.location}</p>
                    <div class="mt-2 flex justify-between">
                        <a href="${p.blogUrl}" target="_blank" class="text-blue-500 text-sm">Lihat Blog</a>
                        <button onclick='editPost(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="text-green-600 text-sm">Edit</button>
                    </div>
                </div>
            `).join('');
        }

        function openPostForm() {
            isEditMode = false;
            document.getElementById('post-form-title').innerText = "Buat Postingan Baru";
            document.getElementById('form-post').reset();
            document.getElementById('photo-upload-area').classList.remove('hidden');
            showView('view-post');
        }

        function editPost(p) {
            isEditMode = true;
            document.getElementById('post-form-title').innerText = "Edit Postingan";
            document.getElementById('field-jsonId').value = p.jsonId;
            document.getElementById('field-title').value = p.title;
            document.getElementById('field-price').value = p.price;
            document.getElementById('field-location').value = p.location;
            document.getElementById('field-description').value = "Edit deskripsi jika perlu...";
            document.getElementById('field-alt_text').value = "Update Alt Text";
            document.getElementById('photo-upload-area').classList.add('hidden'); // Simplified edit
            showView('view-post');
        }

        async function handlePost(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.password = localStorage.getItem('omnipost_pass');
            data.action = isEditMode ? 'updatePost' : 'createPost';

            if (!isEditMode) {
                const file = document.getElementById('post-photo').files[0];
                if (file) data.photoData = await compressImage(file);
                data.jsonId = 'OP-' + Date.now();
            }

            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
            const result = await res.json();
            if (result.success) { showStatus('Berhasil!'); showView('view-dashboard'); }
            else showStatus(result.message, true);
        }

        async function compressImage(file) {
            return new Promise(res => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const max = 1200;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > max) { h *= max/w; w = max; } } else { if (h > max) { w *= max/h; h = max; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        res(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.onload = () => { if (localStorage.getItem('omnipost_pass')) showView('view-dashboard'); };
    </script>
</body>
</html>
