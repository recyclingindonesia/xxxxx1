<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Hantu Interaktif</title>
    <style>
        /* =========================================
           PENGATURAN DASAR & LATAR BELAKANG
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Changed to dark so the glow pops out beautifully! */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        /* =========================================
           WADAH ROBOT & EFEK AURA (HOVER/KLIK)
           ========================================= */
        #robot-container {
            position: relative;
            width: 400px;
            height: 500px;
            cursor: pointer;
            z-index: 10;
            /* Aura dasar */
            filter: drop-shadow(0 0 15px rgba(110, 231, 183, 0.4));
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* Aura meningkat saat kursor diarahkan (Hover) */
        #robot-container:hover {
            filter: drop-shadow(0 0 30px rgba(110, 231, 183, 0.7));
            transform: translateY(-5px);
        }

        /* Aura berdenyut kuat saat diklik & ditahan (Active) */
        #robot-container:active {
            filter: drop-shadow(0 0 50px rgba(110, 231, 183, 1)) brightness(1.2);
            transform: translateY(-2px) scale(0.98);
        }

        /* =========================================
           ANIMASI SVG (CSS KEYFRAMES)
           ========================================= */

        /* 1. Hantu Melayang (Goyah & Mengalir) */
        .ghost-flow {
            animation: flowGently 4s ease-in-out infinite alternate;
            transform-origin: 50% 50%;
        }
        @keyframes flowGently {
            0% { transform: translateY(0px) skewX(0deg); }
            100% { transform: translateY(15px) skewX(-2deg); }
        }

        /* 2. Mata Spiral Berputar */
        .spiral-eye {
            transform-origin: 0px 0px;
            animation: spinEye 3s linear infinite;
        }
        /* Rotasi berlawanan untuk mata kiri/kanan agar lebih hipnotis */
        .eye-left .spiral-eye { animation-direction: normal; }
        .eye-right .spiral-eye { animation-direction: reverse; }

        @keyframes spinEye {
            100% { transform: rotate(360deg); }
        }

        /* 3. Mulut Kilat Berdenyut */
        .lightning-mouth {
            animation: pulseMouth 1.5s ease-in-out infinite alternate;
        }
        @keyframes pulseMouth {
            0% { opacity: 0.5; stroke-width: 2px; filter: drop-shadow(0 0 2px #6ee7b7); }
            100% { opacity: 1; stroke-width: 4px; filter: drop-shadow(0 0 10px #6ee7b7); }
        }

        /* 4. Rantai Bergoyang */
        .chain-sway {
            transform-origin: 0px 0px;
            animation: swayChain 3s ease-in-out infinite alternate;
        }
        .chain-right { animation-delay: 0.5s; /* Delay agar goyangan tidak serentak */ }

        @keyframes swayChain {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

        /* 5. Partikel Bokeh (Latar Belakang) */
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(110,231,183,0.8) 0%, rgba(110,231,183,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 10s linear infinite;
            z-index: 1;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* Transisi halus untuk pergerakan wajah yang mengikuti kursor */
        #face-group {
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>

    <!-- Wadah Utama Robot -->
    <div id="robot-container">
        <!-- SVG Vector Drawing -->
        <svg viewBox="0 0 400 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">

            <!-- DEFS: Filter & Gradien untuk efek visual -->
            <defs>
                <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="60%" stop-color="#f1f5f9"/>
                    <stop offset="100%" stop-color="#cbd5e1"/>
                </linearGradient>
                <linearGradient id="ghostGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8"/>
                    <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
                </linearGradient>
                <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- BAGIAN BELAKANG: Lengan & Ekor Hantu Melayang -->
            <g class="ghost-flow">
                <!-- Ekor Hantu -->
                <path d="M 130,350 Q 150,470 200,490 Q 250,470 270,350 Z" fill="url(#ghostGradient)"/>
                <path d="M 150,350 Q 170,440 200,450 Q 230,440 250,350 Z" fill="rgba(255,255,255,0.4)"/>

                <!-- Lengan Hantu Kiri -->
                <path d="M 110,240 C 40,250 30,340 70,370 C 80,340 70,280 110,270 Z" fill="url(#ghostGradient)"/>
                <path d="M 110,245 C 50,255 45,330 75,355 C 80,335 75,280 110,270 Z" fill="rgba(255,255,255,0.5)"/>

                <!-- Lengan Hantu Kanan -->
                <path d="M 290,240 C 360,250 370,340 330,370 C 320,340 330,280 290,270 Z" fill="url(#ghostGradient)"/>
                <path d="M 290,245 C 350,255 355,330 325,355 C 320,335 325,280 290,270 Z" fill="rgba(255,255,255,0.5)"/>
            </g>

            <!-- Rantai (Kiri & Kanan) -->
            <g transform="translate(90, 250)">
                <g class="chain-sway">
                    <path d="M 10,0 L 0,40 L 15,70" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,6"/>
                </g>
            </g>
            <g transform="translate(310, 250)">
                <g class="chain-sway chain-right">
                    <path d="M 0,0 L 10,35 L -10,65" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,6"/>
                </g>
            </g>

            <!-- BAGIAN TENGAH: Tubuh Robot -->
            <!-- Pundak/Badan -->
            <path d="M 120,210 L 280,210 C 300,210 310,230 300,260 L 270,350 L 130,350 L 100,260 C 90,230 100,210 120,210 Z" fill="url(#bodyGradient)" stroke="#475569" stroke-width="3"/>
            <!-- Detail Garis Badan -->
            <path d="M 125,230 L 275,230" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

            <!-- Es/Cairan Menetes di Bawah Badan -->
            <path d="M 130,350 Q 140,380 150,350 Q 165,390 180,350 Q 195,385 210,350 Q 225,395 240,350 Q 255,380 270,350" fill="url(#bodyGradient)" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

            <!-- Logo R di Dada -->
            <rect x="170" y="250" width="60" height="60" rx="15" fill="#1e293b" stroke="#6ee7b7" stroke-width="3" filter="url(#neonGlow)"/>
            <text x="200" y="292" fill="#6ee7b7" font-size="38" font-weight="900" text-anchor="middle" font-family="sans-serif" filter="url(#neonGlow)">R</text>

            <!-- KEPALA: Monitor Robot -->
            <!-- Leher -->
            <rect x="175" y="195" width="50" height="20" fill="#64748b"/>
            <path d="M 180,195 L 220,195 L 215,210 L 185,210 Z" fill="#475569"/>

            <rect x="90" y="55" width="220" height="150" rx="35" fill="url(#bodyGradient)" stroke="#475569" stroke-width="4"/>
            <!-- Antena/Kamera Atas -->
            <path d="M 160,55 L 175,25 L 225,25 L 240,55 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="200" cy="20" r="8" fill="#1e293b" stroke="#6ee7b7" stroke-width="2" filter="url(#neonGlow)"/>
            <!-- Layar Hitam Dalam -->
            <rect x="110" y="75" width="180" height="110" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>

            <!-- WAJAH INTERAKTIF (Mata & Mulut) -->
            <g id="face-group">
                <!-- Mata Kiri -->
                <g class="eye-left" transform="translate(150, 115)">
                    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#0ea5e9" stroke-width="3" filter="url(#neonGlow)" opacity="0.8"/>
                    <path class="spiral-eye" d="M 0,0 m -12,0 a 12,12 0 1,0 24,0 a 12,12 0 1,0 -24,0 m 4,0 a 8,8 0 1,0 16,0 a 8,8 0 1,0 -16,0 m 4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0" fill="none" stroke="#6ee7b7" stroke-width="3" filter="url(#neonGlow)"/>
                </g>
                <!-- Mata Kanan -->
                <g class="eye-right" transform="translate(250, 115)">
                    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#0ea5e9" stroke-width="3" filter="url(#neonGlow)" opacity="0.8"/>
                    <path class="spiral-eye" d="M 0,0 m -12,0 a 12,12 0 1,0 24,0 a 12,12 0 1,0 -24,0 m 4,0 a 8,8 0 1,0 16,0 a 8,8 0 1,0 -16,0 m 4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0" fill="none" stroke="#6ee7b7" stroke-width="3" filter="url(#neonGlow)"/>
                </g>
                <!-- Mulut Kilat Berdenyut -->
                <path class="lightning-mouth" d="M 150,155 L 170,145 L 190,160 L 210,145 L 230,160 L 250,150" fill="none" stroke="#6ee7b7" stroke-linejoin="round" filter="url(#neonGlow)"/>
            </g>

        </svg>
    </div>

    <!-- SCRIPT JAVASCRIPT: Interaksi Kursor & Partikel -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const faceGroup = document.getElementById("face-group");
            const robotContainer = document.getElementById("robot-container");

            // ==========================================
            // LOGIKA 1: Mata & Mulut Mengikuti Kursor
            // ==========================================
            document.addEventListener("mousemove", (e) => {
                // Mendapatkan posisi tengah layar
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;

                // Menghitung jarak kursor dari tengah layar
                const deltaX = e.clientX - centerX;
                const deltaY = e.clientY - centerY;

                // Menentukan batas maksimal pergeseran wajah (agar tidak keluar dari layar monitor)
                const maxPanX = 15;
                const maxPanY = 10;

                // Mengkalkulasi persentase pergeseran
                const moveX = (deltaX / centerX) * maxPanX;
                const moveY = (deltaY / centerY) * maxPanY;

                // Menerapkan transformasi ke grup wajah secara *real-time*
                faceGroup.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });

            // ==========================================
            // LOGIKA 2: Generator Partikel Latar Belakang (Bokeh)
            // ==========================================
            function createParticles(count) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement("div");
                    particle.classList.add("particle");

                    // Acak ukuran partikel
                    const size = Math.random() * 20 + 10; // Antara 10px - 30px
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;

                    // Acak posisi horizontal (kiri ke kanan)
                    particle.style.left = `${Math.random() * 100}vw`;

                    // Acak durasi dan jeda animasi agar terlihat alami
                    const duration = Math.random() * 8 + 7; // 7s - 15s
                    const delay = Math.random() * 10;
                    particle.style.animationDuration = `${duration}s`;
                    particle.style.animationDelay = `-${delay}s`; // Negatif agar partikel sudah muncul saat diload

                    document.body.appendChild(particle);
                }
            }

            // Memanggil fungsi untuk membuat 30 partikel
            createParticles(30);
        });
    </script>
</body>
</html>
