<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Latihan Drama Dimas</title>
    <style>
        :root {
            --primary: #27ae60;
            --primary-hover: #2ecc71;
            --secondary: #2980b9;
            --secondary-hover: #3498db;
            --warning: #f1c40f;
            --warning-hover: #f39c12;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --danger: #e74c3c;
            --border-color: #ddd;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --card-bg: #16213e;
            --border-color: #333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-theme { background: none; border: 2px solid var(--secondary); color: var(--text-color); padding: 5px 15px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.3s;}
        .btn-theme:hover { background: var(--secondary); color: white; }

        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }

        .video-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 15px; }
        @media (min-width: 768px) { .video-grid { grid-template-columns: 1fr 1fr; } }

        .video-container { display: flex; flex-direction: column; }
        video { width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }
        .video-label { font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; color: var(--secondary); }

        .media-title {
            background-color: var(--secondary); color: #ecf0f1; padding: 10px 15px; border-radius: 8px;
            margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        body.dark-mode .media-title { background-color: #0f3460; }

        .record-controls { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn-record { background-color: var(--danger); flex: 1; }
        .btn-record.recording { animation: blink 1.5s infinite; background-color: #000; }
        @keyframes blink { 50% { opacity: 0.6; } }
        .btn-download { background-color: var(--primary); display: none; flex: 1; }

        .mic-visualizer-container {
            width: 100%; height: 10px; background: rgba(0,0,0,0.1);
            border-radius: 5px; margin-top: 8px; overflow: hidden;
        }
        body.dark-mode .mic-visualizer-container { background: rgba(255,255,255,0.1); }
        #micLevel { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s ease; }
        .mic-hint { font-size: 10px; color: #7f8c8d; text-align: center; margin-top: 2px; }

        .teleprompter { width: 100%; height: 120px; margin-top: 15px; background-color: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-family: inherit; resize: vertical; }

        .big-timer-container { text-align: center; margin-top: 15px; }
        .big-timer { font-size: 3.5rem; font-weight: 700; font-family: 'Courier New', monospace; background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 12px; cursor: pointer; display: inline-block; user-select: none; transition: 0.2s; }
        .big-timer:hover { color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .big-timer:active { transform: scale(0.95); }
        .timer-hint { font-size: 13px; color: var(--primary); margin-top: 8px; font-weight: 600; opacity: 0.8; }

        .input-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: 16px; outline: none;}
        input:focus { border-color: var(--secondary); }
        .time-input { width: 80px; }
        .text-input { flex-grow: 1; }

        button { color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { transform: scale(0.98); }

        .btn-add { width: 100%; background-color: var(--secondary); }
        .btn-add:hover { background-color: var(--secondary-hover); }
        .btn-cancel { width: 100%; background-color: #95a5a6; margin-top: 10px; display: none; }

        .cue-item { display: flex; justify-content: space-between; align-items: stretch; background: var(--card-bg); border: 1px solid var(--border-color); border-left: 5px solid var(--danger); border-radius: 4px; overflow: hidden; margin-bottom: 10px;}
        .cue-trigger { flex-grow: 1; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .cue-trigger:hover { background: rgba(0,0,0,0.05); }
        body.dark-mode .cue-trigger:hover { background: rgba(255,255,255,0.05); }
        .action-btn { background: none; border: none; padding: 0 15px; color: #7f8c8d; font-size: 16px; border-radius: 0;}
        .action-btn:hover { background: rgba(0,0,0,0.1); color: var(--text-color); }
        .action-btn.delete:hover { background: var(--danger); color: white; }

        #errorMsg { display: none; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold; border: 1px solid #fad4d4; }
    </style>
</head>
<body>

    <div class="header-top">
        <h2 style="margin:0;">🎭 Studio Latihan Dimas</h2>
        <button class="btn-theme" onclick="toggleTheme()" id="themeBtn">🌙 Gelap</button>
    </div>

    <div class="card">
        <div id="errorMsg"></div>

        <div class="video-grid">
            <div class="video-container">
                <div class="video-label">📺 Video Naskah</div>
                <video id="player" controls playsinline crossorigin="anonymous"></video>
                <div id="mediaTitle" class="media-title">📂 Belum ada file media</div>
                <button style="margin-top:10px; background:var(--secondary);" onclick="document.getElementById('mediaUpload').click()">📁 Pilih File Naskah</button>
                <input type="file" id="mediaUpload" accept="video/*, audio/*" style="display: none;">
            </div>

            <div class="video-container">
                <div class="video-label">🔴 Kamera Evaluasi</div>
                <video id="webcam" autoplay muted playsinline></video>

                <div class="mic-visualizer-container">
                    <div id="micLevel"></div>
                </div>
                <div class="mic-hint">Gelombang Suara Dimas</div>

                <div class="record-controls">
                    <button id="switchCamBtn" class="btn-warning" style="flex: 1; color:#333;" onclick="switchCamera()">🔄 Kamera</button>
                    <button id="micToggleBtn" style="flex: 1; background-color: var(--primary);" onclick="toggleMic()">🎙️ Mic: ON</button>
                    <button id="noiseToggleBtn" style="flex: 1; background-color: var(--secondary);" onclick="toggleNoiseMitigation()">🛡️ Noise: ON</button>
                    <button id="recordBtn" class="btn-record" onclick="toggleRecording()">⏺️ Rekam</button>
                    <button id="downloadBtn" class="btn-download" onclick="downloadRecording()">💾 Simpan</button>
                </div>
            </div>
        </div>

        <div class="big-timer-container">
            <div id="activeSceneDisplay" style="text-align:center; font-weight:bold; margin-bottom:10px; color:var(--secondary); font-size:1.2rem;">🎬 Menunggu Adegan...</div>
            <div id="bigTimer" class="big-timer" onclick="captureTime()" title="Klik untuk Salin Waktu!">00:00</div>
            <div class="timer-hint">👆 Klik angka untuk menyalin waktu ke form bawah!</div>
        </div>

        <textarea id="scriptArea" class="teleprompter" placeholder="📝 Paste naskah dialog Dimas di sini... (Tersimpan otomatis)" oninput="saveScript()"></textarea>
    </div>

    <div class="card">
        <h3>⏱️ Atur Penanda Adegan</h3>
        <div class="input-group">
            <input type="hidden" id="editId" value="">
            <input type="number" id="min" class="time-input" placeholder="Min" min="0">
            <input type="number" id="sec" class="time-input" placeholder="Det" min="0" max="59">
            <input type="text" id="label" class="text-input" placeholder="Nama Adegan">
        </div>
        <button id="mainBtn" class="btn-add" onclick="saveCue()">+ Tambahkan Titik Latihan</button>
        <button id="cancelBtn" class="btn-cancel" onclick="cancelEdit()">Batal Edit</button>
    </div>

    <div class="card">
        <h3>Daftar Adegan</h3>
        <div id="cueList"></div>
    </div>

    <div class="card" style="text-align: center;">
        <h3 style="text-align: left;">💾 Pengaturan & Data</h3>
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap;">
            <button class="btn-warning" style="flex:1; color:#333;" onclick="exportJSON()">📥 Backup JSON</button>
            <button style="flex:1; background:var(--secondary);" onclick="document.getElementById('jsonUpload').click()">📤 Import JSON</button>
            <input type="file" id="jsonUpload" accept=".json" style="display:none" onchange="importJSON(event)">
        </div>
        <button class="btn-danger" style="width: 100%;" onclick="deleteAllData()">🗑️ Hapus Semua Data</button>
    </div>

    <script>
        // DOM Elements
        const player = document.getElementById('player');
        const webcam = document.getElementById('webcam');
        const recordBtn = document.getElementById('recordBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const bigTimer = document.getElementById('bigTimer');
        const cueList = document.getElementById('cueList');
        const scriptArea = document.getElementById('scriptArea');
        const mediaTitle = document.getElementById('mediaTitle');
        const minInput = document.getElementById('min');
        const secInput = document.getElementById('sec');
        const labelInput = document.getElementById('label');
        const editIdInput = document.getElementById('editId');
        const mainBtn = document.getElementById('mainBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // State Variables
        let cues = [];
        let db;
        let mediaRecorder;
        let recordedChunks = [];
        let currentFacingMode = "user";
        let isMicEnabled = true;
        let isNoiseMitigationEnabled = true;

        // Audio System Globals
        let globalAudioCtx = null;
        let visualizerAnalyser = null;

        // ==========================================
        // 1. DATABASE LOKAL (IndexedDB & LocalStorage)
        // ==========================================
        function initDB() {
            const req = indexedDB.open("DramaMediaDB", 1);
            req.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains('mediaStore')) db.createObjectStore('mediaStore', { keyPath: 'id' });
            };
            req.onsuccess = (e) => { db = e.target.result; loadMediaFromDB(); };
        }

        function saveMediaToDB(fileBlob, fileName) {
            if (!db) return;
            db.transaction(['mediaStore'], 'readwrite').objectStore('mediaStore').put({ id: 'currentVideo', file: fileBlob, name: fileName });
        }

        function loadMediaFromDB() {
            if (!db) return;
            const req = db.transaction(['mediaStore'], 'readonly').objectStore('mediaStore').get('currentVideo');
            req.onsuccess = (e) => {
                if (e.target.result) {
                    player.src = URL.createObjectURL(e.target.result.file);
                    mediaTitle.innerHTML = `🎬 <b>Memutar:</b> ${e.target.result.name}`;
                }
            };
        }

        document.getElementById('mediaUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                player.src = URL.createObjectURL(file);
                mediaTitle.innerHTML = `🎬 <b>Memutar:</b> ${file.name}`;
                saveMediaToDB(file, file.name);
            }
        });

        // ==========================================
        // 2. KAMERA & VISUALIZER
        // ==========================================
        async function initCamera() {
            if (webcam.srcObject) webcam.srcObject.getTracks().forEach(track => track.stop());
            try {
                // Konfigurasi audio: Mengikuti status mitigasi noise
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: {
                        echoCancellation: isNoiseMitigationEnabled,
                        noiseSuppression: isNoiseMitigationEnabled,
                        autoGainControl: !isNoiseMitigationEnabled
                    }
                });
                stream.getAudioTracks().forEach(track => track.enabled = isMicEnabled);
                webcam.srcObject = stream;
                startVisualizer(stream);
            } catch (err) {
                showError("❌ Kamera/Mic tidak dapat diakses. Cek izin browser.");
            }
        }

        function switchCamera() {
            if (mediaRecorder && mediaRecorder.state === "recording") { showError("⚠️ Hentikan rekaman dulu!"); return; }
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            initCamera();
        }

        function toggleMic() {
            isMicEnabled = !isMicEnabled;
            const micBtn = document.getElementById('micToggleBtn');
            micBtn.innerHTML = isMicEnabled ? "🎙️ Mic: ON" : "🔇 Mic: OFF";
            micBtn.style.backgroundColor = isMicEnabled ? "var(--primary)" : "#95a5a6";
            if (webcam.srcObject) webcam.srcObject.getAudioTracks().forEach(track => track.enabled = isMicEnabled);
        }

        async function toggleNoiseMitigation() {
            isNoiseMitigationEnabled = !isNoiseMitigationEnabled;
            const noiseBtn = document.getElementById('noiseToggleBtn');
            noiseBtn.innerHTML = isNoiseMitigationEnabled ? "🛡️ Noise: ON" : "🛡️ Noise: OFF";
            noiseBtn.style.backgroundColor = isNoiseMitigationEnabled ? "var(--secondary)" : "#95a5a6";

            if (webcam.srcObject) {
                const audioTracks = webcam.srcObject.getAudioTracks();
                for (const track of audioTracks) {
                    try {
                        await track.applyConstraints({
                            echoCancellation: isNoiseMitigationEnabled,
                            noiseSuppression: isNoiseMitigationEnabled,
                            autoGainControl: !isNoiseMitigationEnabled
                        });
                    } catch (e) {
                        console.error("Gagal menerapkan mitigasi noise", e);
                    }
                }
            }
            showError(`🛡️ Mitigasi Noise: ${isNoiseMitigationEnabled ? 'AKTIF' : 'NON-AKTIF'}`, true);
        }

        function startVisualizer(stream) {
            if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!visualizerAnalyser) {
                visualizerAnalyser = globalAudioCtx.createAnalyser();
                visualizerAnalyser.fftSize = 256;
            }

            // Bypass Auto-Play Policy (HANTU Layer)
            if (globalAudioCtx.state === 'suspended') {
                const wakeUpAudio = () => {
                    globalAudioCtx.resume();
                    document.removeEventListener('click', wakeUpAudio);
                };
                document.addEventListener('click', wakeUpAudio);
            }

            try {
                const micSrc = globalAudioCtx.createMediaStreamSource(stream);
                micSrc.connect(visualizerAnalyser);

                const dataArray = new Uint8Array(visualizerAnalyser.frequencyBinCount);
                const micLevel = document.getElementById('micLevel');

                const update = () => {
                    if(!isMicEnabled) {
                        micLevel.style.width = '0%';
                        requestAnimationFrame(update); return;
                    }
                    visualizerAnalyser.getByteFrequencyData(dataArray);
                    let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                    let avg = sum / dataArray.length;
                    let width = Math.min(100, avg * 1.5);
                    micLevel.style.width = width + '%';
                    micLevel.style.backgroundColor = width > 85 ? 'var(--danger)' : 'var(--primary)';
                    requestAnimationFrame(update);
                };
                update();
            } catch(e) { console.log("Visualizer gagal setup.", e); }
        }

        // ==========================================
        // 3. MIXER & PEREKAMAN (OTAK & TUYUL)
        // ==========================================
        async function toggleRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtn.textContent = "⏺️ Rekam";
                recordBtn.classList.remove('recording');
                downloadBtn.style.display = "block";
            } else {
                const camStream = webcam.srcObject;
                if(!camStream || camStream.getAudioTracks().length === 0) {
                    showError("❌ Kamera/Mic belum siap!"); return;
                }

                if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (globalAudioCtx.state === 'suspended') await globalAudioCtx.resume();

                const mixerDest = globalAudioCtx.createMediaStreamDestination();

                // Mix 1: Suara Mic
                try {
                    const micSource = globalAudioCtx.createMediaStreamSource(camStream);
                    const micGain = globalAudioCtx.createGain();
                    micGain.gain.value = 1.0;
                    micSource.connect(micGain);
                    micGain.connect(mixerDest);
                } catch(e) { console.error("Mic mix gagal", e); }

                // Mix 2: Suara Video Naskah (TUYUL captureStream)
                let videoStream = null;
                if (player.captureStream) videoStream = player.captureStream();
                else if (player.mozCaptureStream) videoStream = player.mozCaptureStream();

                if (videoStream && videoStream.getAudioTracks().length > 0) {
                    try {
                        const videoSource = globalAudioCtx.createMediaStreamSource(videoStream);
                        const videoGain = globalAudioCtx.createGain();
                        videoGain.gain.value = 0.8;
                        videoSource.connect(videoGain);
                        videoGain.connect(mixerDest);
                    } catch(e) { console.error("Video mix gagal", e); }
                }

                // Final Assembly: Video Webcam + Audio Gabungan
                const videoTracks = camStream.getVideoTracks();
                const mixedAudioTracks = mixerDest.stream.getAudioTracks();
                const finalStream = new MediaStream([...videoTracks, ...mixedAudioTracks]);

                recordedChunks = [];
                // Resiliensi Codec
                try {
                    mediaRecorder = new MediaRecorder(finalStream, { mimeType: 'video/webm;codecs=vp8,opus' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(finalStream);
                }

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.start();

                recordBtn.textContent = "⏹️ Berhenti";
                recordBtn.classList.add('recording');
                downloadBtn.style.display = "none";

                if (player.src && player.src !== window.location.href) {
                    player.play().catch(e => console.log("Autoplay block", e));
                }
                showError("⏺️ Merekam Suara Dimas & Naskah!", true);
            }
        }

        function downloadRecording() {
            if (recordedChunks.length === 0) return;
            const mimeType = mediaRecorder ? mediaRecorder.mimeType : "video/webm";
            const ext = mimeType.includes("mp4") ? "mp4" : "webm";
            const blob = new Blob(recordedChunks, { type: mimeType || "video/webm" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `Latihan_Dimas_${Date.now()}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showError("✅ Rekaman Disimpan!", true);
        }

        // ==========================================
        // 4. LOGIKA TIMER & ADEGAN (CUES)
        // ==========================================
        player.addEventListener('timeupdate', () => {
            if(!player.duration) return;
            const t = player.currentTime;
            const m = Math.floor(t / 60); const s = Math.floor(t % 60);
            bigTimer.textContent = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;

            const current = cues.filter(c => c.totalSeconds <= t).sort((a,b) => b.totalSeconds - a.totalSeconds)[0];
            document.getElementById('activeSceneDisplay').textContent = current ? `🎬 ${current.label}` : "🎬 Belum masuk adegan";
        });

        function captureTime() {
            if (!player.src || player.src === window.location.href) { showError("Masukkan video dulu!"); return; }
            minInput.value = Math.floor(player.currentTime / 60); secInput.value = Math.floor(player.currentTime % 60);
            bigTimer.style.color = "var(--primary)"; setTimeout(() => bigTimer.style.color = "", 300);
            labelInput.focus(); if (!player.paused) player.pause();
        }

        function saveCue() {
            const m = parseInt(minInput.value) || 0; const s = parseInt(secInput.value) || 0;
            const lbl = labelInput.value.trim() || "Adegan Baru"; const editId = editIdInput.value;
            const totalSec = (m * 60) + s; const dispTime = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;

            if (editId) {
                const idx = cues.findIndex(c => c.id == editId);
                if (idx !== -1) cues[idx] = { id: editId, min: m, sec: s, label: lbl, totalSeconds: totalSec, displayTime: dispTime };
                showError("✅ Adegan Diperbarui!", true);
            } else {
                cues.push({ id: Date.now(), min: m, sec: s, label: lbl, totalSeconds: totalSec, displayTime: dispTime });
            }
            localStorage.setItem('dramaCuesData', JSON.stringify(cues)); renderCues(); cancelEdit();
        }

        function prepareEdit(id) {
            const c = cues.find(c => c.id == id); if (!c) return;
            minInput.value = c.min; secInput.value = c.sec; labelInput.value = c.label; editIdInput.value = c.id;
            mainBtn.textContent = "💾 Update Adegan"; mainBtn.style.backgroundColor = "#f39c12";
            cancelBtn.style.display = "block"; minInput.focus();
        }

        function cancelEdit() {
            minInput.value = ''; secInput.value = ''; labelInput.value = ''; editIdInput.value = '';
            mainBtn.textContent = "+ Tambahkan Titik Latihan"; mainBtn.style.backgroundColor = "var(--secondary)";
            cancelBtn.style.display = "none";
        }

        function deleteCue(id) {
            if(confirm("Hapus adegan ini?")) {
                cues = cues.filter(c => c.id != id); localStorage.setItem('dramaCuesData', JSON.stringify(cues));
                renderCues(); if(editIdInput.value == id) cancelEdit();
            }
        }

        function renderCues() {
            cueList.innerHTML = '';
            if(cues.length === 0) { cueList.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Belum ada penanda.</p>'; return; }
            cues.sort((a,b) => a.totalSeconds - b.totalSeconds).forEach(c => {
                const div = document.createElement('div'); div.className = 'cue-item';
                div.innerHTML = `
                    <div class="cue-trigger" onclick="player.currentTime=${c.totalSeconds}; player.play();">
                        <span style="font-weight: 600;">▶ ${c.label}</span>
                        <span style="font-family: monospace;">[${c.displayTime}]</span>
                    </div>
                    <div style="display:flex;">
                        <button class="action-btn" onclick="prepareEdit(${c.id})">✏️</button>
                        <button class="action-btn delete" onclick="deleteCue(${c.id})">🗑️</button>
                    </div>`;
                cueList.appendChild(div);
            });
        }

        // ==========================================
        // 5. UTILITAS (JSON, Teleprompter, UI)
        // ==========================================
        function showError(msg, isSuccess = false) {
            const err = document.getElementById('errorMsg');
            err.textContent = msg; err.style.display = 'block';
            err.style.background = isSuccess ? '#eafaf1' : '#fdeaea';
            err.style.color = isSuccess ? '#27ae60' : '#e74c3c';
            err.style.borderColor = isSuccess ? '#c3f0d5' : '#fad4d4';
            setTimeout(() => err.style.display = 'none', 3000);
        }

        function exportJSON() {
            if (cues.length === 0) { showError("Belum ada data!"); return; }
            const blob = new Blob([JSON.stringify(cues, null, 2)], { type: "application/json" });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `Cues_Dimas_${Date.now()}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function importJSON(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        cues = data.map(i => ({
                            id: i.id || Date.now() + Math.random(), min: Number(i.min)||0, sec: Number(i.sec)||0,
                            label: i.label||'Adegan', totalSeconds: i.totalSeconds || ((Number(i.min)||0)*60 + (Number(i.sec)||0)),
                            displayTime: i.displayTime || `${(i.min<10?'0':'')+i.min}:${(i.sec<10?'0':'')+i.sec}`
                        }));
                        localStorage.setItem('dramaCuesData', JSON.stringify(cues)); renderCues(); showError("✅ Import Sukses!", true);
                    }
                } catch (err) { showError("❌ JSON Rusak!"); }
                document.getElementById('jsonUpload').value = '';
            };
            reader.readAsText(file);
        }

        function deleteAllData() {
            if(confirm("⚠️ PERINGATAN!\nHapus SEMUA video, adegan, dan teks teleprompter?")) {
                cues = []; localStorage.removeItem('dramaCuesData'); localStorage.removeItem('dramaScript');
                if(db) db.transaction(['mediaStore'], 'readwrite').objectStore('mediaStore').delete('currentVideo');
                player.src = ""; mediaTitle.innerHTML = "📂 Belum ada file media";
                scriptArea.value = ""; bigTimer.textContent = "00:00"; document.getElementById('activeSceneDisplay').textContent = "🎬 Menunggu Adegan...";
                document.getElementById('mediaUpload').value = ''; renderCues(); cancelEdit();
                showError("✅ Bersih total!", true);
            }
        }

        function saveScript() { localStorage.setItem('dramaScript', scriptArea.value); }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('dramaTheme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            document.getElementById('themeBtn').textContent = document.body.classList.contains('dark-mode') ? '☀️ Terang' : '🌙 Gelap';
        }

        function init() {
            const savedCues = localStorage.getItem('dramaCuesData');
            if (savedCues) cues = JSON.parse(savedCues);
            const savedScript = localStorage.getItem('dramaScript');
            if (savedScript) scriptArea.value = savedScript;

            if(localStorage.getItem('dramaTheme') === 'dark') { document.body.classList.add('dark-mode'); document.getElementById('themeBtn').textContent = '☀️ Terang'; }

            renderCues(); initDB(); initCamera();
        }

        // Start Application
        init();
    </script>
</body>
</html>
